# agmux configuration — ~/.config/agmux/config.toml ($XDG_CONFIG_HOME/agmux/config.toml)
# Every setting is optional; a missing one keeps its default. `agmux config` prints the
# effective values. Defaults are shown in the comments; lines left at their default are harmless.

[keys]
# Each action takes a list of key names (bubbletea names): any single character, "enter", "esc",
# "tab", "shift+tab", "space", "backspace", "up"/"down"/"left"/"right", "home"/"end", "pgup"/"pgdown",
# "f1".."f20", "ctrl+<letter>", "alt+<key>". An uppercase letter means shift+letter.
# ctrl+c cannot be bound (it always quits); ctrl+i and ctrl+m are tab and enter.
# A key may be bound to only one action, but confirm and leave_preview may share keys with others.
up = ["k", "up"]              # default: k, up
down = ["j", "down"]          # default: j, down
left = ["h", "left"]          # default: h, left
right = ["l", "right"]        # default: l, right
page_down = ["ctrl+d"]        # default: ctrl+d — scroll the board a page down
page_up = ["ctrl+u"]          # default: ctrl+u — scroll the board a page up
jump = ["enter"]              # default: enter — switch tmux to the focused pane
fold = ["f"]                  # default: f — fold / unfold the focused group
preview = ["p"]               # default: p — open / close the pane preview
focus_preview = ["tab"]       # default: tab — pass keys through to the previewed pane
leave_preview = ["tab"]       # default: tab — back to the board
reply = ["i"]                 # default: i — type a reply into the focused session
handoff = ["H"]               # default: H — send /handoff to the focused session
search = ["/"]                # default: / — filter the cards by fuzzy search
next_match = ["n"]            # default: n — next search hit
prev_match = ["N"]            # default: N — previous search hit
flash = ["s"]                 # default: s — move the focus to a card by its label
group = ["g"]                 # default: g — cycle the grouping (see [layout] group_by)
group_cwd = []                # default: none — switch straight to the cwd grouping
group_project = []            # default: none — switch straight to the project grouping
group_session = []            # default: none — switch straight to the session grouping
group_state = []              # default: none — switch straight to the state grouping
restart = ["r"]               # default: r — restart the focused session
kill = ["x"]                  # default: x — kill the focused session (asks first)
review = ["d"]                # default: d — run `ccmux review` on the focused session
avatar = ["a"]                # default: a — open or close the avatar picker under the focused card
pin = ["t"]                   # default: t — pin the focused card to the top of its group
quit = ["q", "esc"]           # default: q, esc — with `board --stay` inside a popup: hide instead
exit = ["Q"]                  # default: Q — always quit, even with --stay
confirm = ["y"]               # default: y — answer yes to a prompt

[colors]
# A color is "#rrggbb" or an ANSI palette index "0".."255" (as a string).
working = "#ffb86c"           # default: #ffb86c — card border / status while an agent works
idle = "#585b70"              # default: #585b70
done = "#50fa7b"              # default: #50fa7b
attention = "#ff6188"         # default: #ff6188 — waiting for you / alerts
focus = "#ff8ebe"             # default: #ff8ebe — the focused card
match = "#f2d06b"             # default: #f2d06b — search hits
border = ""                   # default: "" (follow the status) — borders of unfocused cards
name = "5"                    # default: 5 — session name
branch = "12"                 # default: 12
model = "14"                  # default: 14
effort = "13"                 # default: 13
agent = "#bd93f9"             # default: #bd93f9 — the agent role on line 2
dir = "11"                    # default: 11 — group headers and their rule
bar_low = "#a6e3a1"           # default: #a6e3a1 — context bar, low usage
bar_mid = "#f9e2af"           # default: #f9e2af
bar_high = "#ff6188"          # default: #ff6188
bar_empty = "#585b70"         # default: #585b70
muted = "#6272a4"             # default: #6272a4 — secondary text, footer
disabled = "#45475a"          # default: #45475a

[layout]
max_columns = 4               # default: 4 — 1 to 8; fewer columns are used when the terminal is narrow
flow = "bands"                # default: "bands" — "bands": a row of groups at a time, all rows the same
                              #   height; "stack": groups stack down each column, no gaps
group_by = "cwd"              # default: "cwd" — grouping at start: "cwd", "project", "session" or
                              #   "state"; the group key cycles through them in that order

[avatars]
renderer = "auto"             # default: "auto" — "auto": pictures in kitty / ghostty, pixel art
                              #   elsewhere; "image": always pictures; "pixel": always pixel art
default = "hash"              # default: "hash" — "hash": pick one from the session name (a picture set
                              #   in picture mode, a pixel avatar otherwise); or an avatar id (see `agmux avatars`)
                              #   for every unbound session

[avatars.bind]
# session name = avatar id, e.g.  "agmux" = "nova"
# The picker (a) saves its choices in $XDG_STATE_HOME/agmux/avatars.json instead; they win over these.
# Your own sets go in ~/.config/agmux/avatars/<id>/<state>/*.png (states: idle, think, read,
# write, tool, hi, success) or `agmux avatars import <sheet.png> --name <id>`.

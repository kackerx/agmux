# vet, gofmt, go mod tidy and the unit tests. test/e2e is not run here: it is
# Python on a real tmux.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # release.yml runs the same checks before it builds

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt and go mod tidy leave nothing to change
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go mod tidy
          git diff --exit-code go.mod go.sum
